openapi: 3.1.0
info:
  description: Enterprise ontology and governed context platform API.
  title: Entloom API
  version: 0.1.0
servers:
- url: http://localhost:8080
paths:
  /api/v1/auth/me:
    get:
      responses:
        "200":
          description: Authenticated user
      security:
      - basicAuth: []
      summary: Read the authenticated user
      x-accepts:
      - application/json
  /api/v1/projects:
    get:
      responses:
        "200":
          description: Project list
      security:
      - basicAuth: []
      summary: List projects
      x-accepts:
      - application/json
    post:
      responses:
        "201":
          description: Created project
      security:
      - basicAuth: []
      summary: Create a project
      x-accepts:
      - application/json
  /api/v1/projects/{projectId}/ontologies:
    get:
      parameters:
      - $ref: '#/components/parameters/projectId'
      responses:
        "200":
          description: Ontology list
      security:
      - basicAuth: []
      summary: List project ontologies
      x-accepts:
      - application/json
    parameters:
    - $ref: '#/components/parameters/projectId'
    post:
      parameters:
      - $ref: '#/components/parameters/projectId'
      responses:
        "201":
          description: Created ontology
      security:
      - basicAuth: []
      summary: Create an ontology
      x-accepts:
      - application/json
  /api/v1/projects/{projectId}/ontologies/{ontologyId}/export:
    get:
      parameters:
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/ontologyId'
      responses:
        "200":
          description: Ontology transfer document
      security:
      - basicAuth: []
      summary: Export an ontology as transfer JSON
      x-accepts:
      - application/json
    parameters:
    - $ref: '#/components/parameters/projectId'
    - $ref: '#/components/parameters/ontologyId'
  /api/v1/projects/{projectId}/ontologies/import:
    parameters:
    - $ref: '#/components/parameters/projectId'
    post:
      parameters:
      - $ref: '#/components/parameters/projectId'
      responses:
        "201":
          description: Imported draft ontology
      security:
      - basicAuth: []
      summary: Import a transfer JSON document as a new draft
      x-accepts:
      - application/json
  /api/v1/projects/{projectId}/ontologies/{ontologyId}/validation-jobs:
    get:
      parameters:
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/ontologyId'
      responses:
        "200":
          description: Validation job history
      security:
      - basicAuth: []
      summary: List validation jobs
      x-accepts:
      - application/json
    parameters:
    - $ref: '#/components/parameters/projectId'
    - $ref: '#/components/parameters/ontologyId'
    post:
      parameters:
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/ontologyId'
      responses:
        "201":
          description: Completed validation job
      security:
      - basicAuth: []
      summary: Run a validation job
      x-accepts:
      - application/json
  /api/v1/projects/{projectId}/ontologies/{ontologyId}/layout:
    get:
      parameters:
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/ontologyId'
      responses:
        "200":
          description: Graph layout
      security:
      - basicAuth: []
      summary: Read graph layout
      x-accepts:
      - application/json
    parameters:
    - $ref: '#/components/parameters/projectId'
    - $ref: '#/components/parameters/ontologyId'
    patch:
      parameters:
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/ontologyId'
      responses:
        "200":
          description: Saved graph layout
      security:
      - basicAuth: []
      summary: Save graph layout
      x-accepts:
      - application/json
components:
  parameters:
    projectId:
      explode: false
      in: path
      name: projectId
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    ontologyId:
      explode: false
      in: path
      name: ontologyId
      required: true
      schema:
        format: uuid
        type: string
      style: simple
  schemas: {}
  securitySchemes:
    basicAuth:
      scheme: basic
      type: http

