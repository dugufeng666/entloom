name: Release clients

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  package-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate clients
        run: ./scripts/generate-clients.sh

      - name: Build JavaScript package
        working-directory: clients/javascript
        run: |
          npm install --no-audit --no-fund
          npm run build
          mkdir -p dist
          npm pack --pack-destination dist

      - name: Build Java package
        working-directory: clients/java
        run: mvn -B -DskipTests package

      - name: Build Python package
        working-directory: clients/python
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Collect release files
        run: |
          mkdir -p release
          cp clients/javascript/dist/*.tgz release/
          cp clients/java/target/entloom-client-*.jar release/
          cp clients/python/dist/* release/
          sha256sum release/* > release/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --title "Entloom ${GITHUB_REF_NAME}"

  publish-npm:
    if: ${{ vars.ENTLOOM_PUBLISH_PACKAGES == 'true' }}
    needs: package-clients
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Generate client
        run: ./scripts/generate-clients.sh
      - name: Publish to npm with trusted publishing
        working-directory: clients/javascript
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm publish --access public

  publish-pypi:
    if: ${{ vars.ENTLOOM_PUBLISH_PACKAGES == 'true' }}
    needs: package-clients
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate client
        run: ./scripts/generate-clients.sh
      - name: Build Python package
        working-directory: clients/python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist/

  publish-maven-central:
    if: ${{ vars.ENTLOOM_PUBLISH_PACKAGES == 'true' }}
    needs: package-clients
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Generate client
        run: ./scripts/generate-clients.sh
      - name: Import Maven signing key
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Publish to Maven Central
        working-directory: clients/java
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -Psign-artifacts -DskipTests -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE" deploy
