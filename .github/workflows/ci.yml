name: Entloom CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: server/pom.xml
      - run: chmod +x mvnw
        working-directory: server
      - run: ./mvnw -B -ntp --errors test
        working-directory: server

  ui-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui
      - run: npm run test
        working-directory: ui
      - run: npm run build
        working-directory: ui

  containers:
    runs-on: ubuntu-latest
    needs: [server-test, ui-check]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          tags: entloom-server:ci
      - uses: docker/build-push-action@v6
        with:
          context: ./ui
          push: false
          tags: entloom-ui:ci
