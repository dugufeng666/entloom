openapi: 3.1.0
info:
  title: Entloom API
  version: 0.1.0
  description: Enterprise ontology and governed context platform API.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/auth/me:
    get:
      summary: Read the authenticated user
      security: [{ basicAuth: [] }]
      responses: { '200': { description: Authenticated user } }
  /api/v1/projects:
    get:
      summary: List projects
      security: [{ basicAuth: [] }]
      responses: { '200': { description: Project list } }
    post:
      summary: Create a project
      security: [{ basicAuth: [] }]
      responses: { '201': { description: Created project } }
  /api/v1/projects/{projectId}/ontologies:
    parameters: [{ $ref: '#/components/parameters/projectId' }]
    get:
      summary: List project ontologies
      security: [{ basicAuth: [] }]
      responses: { '200': { description: Ontology list } }
    post:
      summary: Create an ontology
      security: [{ basicAuth: [] }]
      responses: { '201': { description: Created ontology } }
  /api/v1/projects/{projectId}/ontologies/{ontologyId}/export:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
      - { $ref: '#/components/parameters/ontologyId' }
    get:
      summary: Export an ontology as transfer JSON
      security: [{ basicAuth: [] }]
      responses: { '200': { description: Ontology transfer document } }
  /api/v1/projects/{projectId}/ontologies/import:
    parameters: [{ $ref: '#/components/parameters/projectId' }]
    post:
      summary: Import a transfer JSON document as a new draft
      security: [{ basicAuth: [] }]
      responses: { '201': { description: Imported draft ontology } }
  /api/v1/projects/{projectId}/ontologies/{ontologyId}/validation-jobs:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
      - { $ref: '#/components/parameters/ontologyId' }
    get:
      summary: List validation jobs
      security: [{ basicAuth: [] }]
      responses: { '200': { description: Validation job history } }
    post:
      summary: Run a validation job
      security: [{ basicAuth: [] }]
      responses: { '201': { description: Completed validation job } }
  /api/v1/projects/{projectId}/ontologies/{ontologyId}/layout:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
      - { $ref: '#/components/parameters/ontologyId' }
    get:
      summary: Read graph layout
      security: [{ basicAuth: [] }]
      responses: { '200': { description: Graph layout } }
    patch:
      summary: Save graph layout
      security: [{ basicAuth: [] }]
      responses: { '200': { description: Saved graph layout } }
components:
  securitySchemes:
    basicAuth: { type: http, scheme: basic }
  parameters:
    projectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    ontologyId: { name: ontologyId, in: path, required: true, schema: { type: string, format: uuid } }
