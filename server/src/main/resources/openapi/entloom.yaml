          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - ARCHIVED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    CreateOntologyRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
        description:
          type: string
          maxLength: 1000
          minLength: 0
      required:
      - name
    OntologyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - DRAFT
          - RELEASED
          - ARCHIVED
        requireClassProperties:
          type: boolean
        allowSelfRelations:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    ReleaseOntologyRequest:
      type: object
      properties:
        version:
          type: string
          minLength: 1
          pattern: \d+\.\d+\.\d+
        notes:
          type: string
          maxLength: 2000
          minLength: 0
      required:
      - version
    OntologyReleaseResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ontologyId:
          type: string
          format: uuid
        version:
          type: string
        notes:
          type: string
        releasedBy:
          type: string
        releasedAt:
          type: string
          format: date-time
        classCount:
          type: integer
          format: int64
        propertyCount:
          type: integer
          format: int64
        relationCount:
          type: integer
          format: int64
    CreateOntologyRelationRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
        description:
          type: string
          maxLength: 1000
          minLength: 0
        sourceClassId:
          type: string
