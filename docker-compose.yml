services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: entloom
      POSTGRES_USER: entloom
      POSTGRES_PASSWORD: ${ENTLOOM_DB_PASSWORD:-entloom}
    ports:
      - "5432:5432"
    volumes:
      - entloom-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entloom -d entloom"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2
    ports:
      - "6379:6379"
    volumes:
      - entloom-redis:/data

  server:
    build:
      context: ./server
    environment:
      ENTLOOM_DB_URL: jdbc:postgresql://postgres:5432/entloom
      ENTLOOM_DB_USERNAME: entloom
      ENTLOOM_DB_PASSWORD: ${ENTLOOM_DB_PASSWORD:-entloom}
      ENTLOOM_REDIS_URL: redis://redis:6379
      ENTLOOM_DEV_USERNAME: ${ENTLOOM_DEV_USERNAME:-entloom}
      ENTLOOM_DEV_PASSWORD: ${ENTLOOM_DEV_PASSWORD:-change-me}
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  ui:
    build:
      context: ./ui
      args:
        VITE_ENTLOOM_API_BASE_URL: ${VITE_ENTLOOM_API_BASE_URL:-}
    ports:
      - "4173:80"
    depends_on:
      - server

volumes:
  entloom-postgres:
  entloom-redis:
